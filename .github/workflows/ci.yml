name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Backtrace of a crashing test
        if: failure()
        run: |
          bundle=$(find .build -name "AlloyPackageTests.xctest" -maxdepth 3 | head -1)
          lldb --batch -o "process handle SIGTRAP -s true" -o run -o "bt 30" -- "$(xcrun -f xctest)" -XCTest AlloyAppKitTests.InputTests "$bundle" | tail -60
