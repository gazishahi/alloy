name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Crash reports
        if: failure()
        run: |
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -2); do
            echo "== $f"; python3 -c "
          import json,sys
          lines=open(sys.argv[1]).read().split('\n',1)
          d=json.loads(lines[1])
          print(d.get('exception'), d.get('termination',{}).get('indicator'))
          t=[t for t in d['threads'] if t.get('triggered')][0]
          imgs=d['usedImages']
          for fr in t['frames'][:25]:
              print(imgs[fr['imageIndex']].get('name','?'), fr.get('symbol','?'), fr.get('sourceFile',''), fr.get('sourceLine',''))
          " "$f"; done
